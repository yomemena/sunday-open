document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

=\"width:140px;display:block;\">\n\u003cdiv style=\"font-family:'Montserrat',sans-serif;font-weight:300;font-size:13px;border-left:1px solid rgba(255,255,255,.4);padding-left:18px;\">Рабочее пространство Project Office · 25.10 – 15.11\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:11px;\">\n\u003cspan role=\"status\" aria-live=\"polite\" style=\"color:#BFE3FF;\">{{ savedLabel }}\u003c/span>\n\u003cbutton sc-camel-on-click=\"{{ retrySync }}\" style=\"background:transparent;border:1px solid #BFE3FF;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;\">Повторить связь\u003c/button>\n\u003cbutton sc-camel-on-click=\"{{ downloadBackup }}\" style=\"background:transparent;border:1px solid #BFE3FF;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;\">Скачать копию\u003c/button>\n\u003cbutton sc-camel-on-click=\"{{ resetAll }}\" style=\"background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 14px;font-size:11px;cursor:pointer;\" style-hover=\"background:rgba(255,255,255,.22)\">Сбросить калькулятор\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;gap:4px;margin-top:20px;overflow-x:auto;\">\n\u003csc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"10\">\n\u003cbutton data-id=\"{{ t.id }}\" sc-camel-on-click=\"{{ setTab }}\" style=\"flex:none;border:0;cursor:pointer;padding:11px 16px;border-radius:12px 12px 0 0;font-family:'Montserrat',sans-serif;font-weight:600;font-size:12.5px;background:{{ t.bg }};color:{{ t.fg }};\">{{ t.label }}\u003c/button>\n\u003c/sc-for>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv style=\"flex:1;padding:26px clamp(16px,4vw,44px) 60px;\">\n\u003cdiv style=\"max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px;\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:6px;\">\n\u003csc-if value=\"{{ hasConflicts }}\">\n\u003cdiv role=\"alert\" style=\"background:#FFF3D1;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;\">\n\u003cstrong>Строку уже изменил другой человек: {{ conflictNames }}\u003c/strong>\n\u003cspan>Ваши правки остались в черновике и не заменили изменения команды. Скачайте копию для сверки или загрузите версию команды. Черновик останется доступен в истории ниже.\u003c/span>\n\u003cbutton sc-camel-on-click=\"{{ useTeamVersion }}\" style=\"align-self:flex-start;border:1px solid #8A6300;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;\">Загрузить версию команды\u003c/button>\n\u003c/div>\n\u003c/sc-if>\n\u003csc-if value=\"{{ hasRecovery }}\">\n\u003cdetails style=\"background:#fff;border:1px solid #CFE0F3;border-radius:12px;padding:12px;\">\n\u003csummary>История черновиков на этом устройстве\u003c/summary>\n\u003cp>Здесь также видны несохранённые правки из других вкладок. Открытие черновика не заменяет данные команды.\u003c/p>\n\u003csc-for list=\"{{ recoveryDrafts }}\" as=\"draft\">\n\u003cbutton data-id=\"{{ draft.id }}\" sc-camel-on-click=\"{{ recoverDraft }}\" style=\"display:block;margin:8px 0;border:1px solid #CFE0F3;background:#F5F8FC;border-radius:8px;padding:8px 12px;cursor:pointer;\">Открыть: {{ draft.at }} · {{ draft.tables }}\u003c/button>\n\u003c/sc-for>\n\u003c/details>\n\u003c/sc-if>\n\u003cdiv style=\"font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(22px,3vw,30px);color:#2B3A8D;line-height:1.1;\">{{ tabTitle }}\u003c/div>\n\u003cdiv style=\"font-size:14px;line-height:1.55;color:#33416b;max-width:820px;text-wrap:pretty;\">{{ tabIntro }}\u003c/div>\n\u003c/div>\n\n\u003csc-if value=\"{{ isStart }}\" hint-placeholder-val=\"{{ true }}\">\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;\">\n\u003csc-for list=\"{{ sundays }}\" as=\"s\" hint-placeholder-count=\"4\">\n\u003cdiv style=\"background:#fff;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;\">\n\u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;\">\u003cspan style=\"font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px;color:#2B3A8D;\">{{ s.date }}\u003c/span>\u003cspan style=\"background:#FCC52A;color:#2B3A8D;font-family:'Montserrat',sans-serif;font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;\">{{ s.audience }}\u003c/span>\u003c/div>\n\u003cdiv style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;color:#288ECE;\">{{ s.theme }}\u003c/div>\n\u003cdiv style=\"font-size:12.5px;line-height:1.5;color:#33416b;\">{{ s.mission }}\u003c/div>\n\u003cdiv style=\"font-size:12px;line-height:1.5;border-top:1px solid #E3EBF5;padding-top:8px;\">{{ s.events }}\u003c/div>\n\u003c/div>\n\u003c/sc-for>\n\u003c/div>\n\u003c/sc-if>\n\n\u003csc-if value=\"{{ isBrief }}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv style=\"background:#fff;border-radius:16px;padding:16px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;\">\n\u003csc-for list=\"{{ briefTabs }}\" as=\"b\">\n\u003cbutton data-i=\"{{ b.i }}\" sc-camel-on-click=\"{{ pickBrief }}\" style=\"border:1px solid #CFE0F3;cursor:pointer;padding:7px 14px;border-radius:999px;font-size:12.5px;background:{{ b.bg }};color:{{ b.fg }};\">{{ b.name }}\u003c/button>\n\u003c/sc-for>\n\u003cbutton sc-camel-on-click=\"{{ addBrief }}\" style=\"border:1px dashed #288ECE;background:transparent;color:#288ECE;cursor:pointer;padding:7px 14px;border-radius:999px;font-size:12.5px;\">+ Новый ивент\u003c/button>\n\u003c/div>\n\u003cdiv style=\"background:#2B3A8D;border-radius:16px;padding:18px 22px;color:#fff;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;\">\n\u003cinput data-k=\"name\" value=\"{{ brief.name }}\" sc-camel-on-change=\"{{ onBrief }}\" style=\"flex:1;min-width:240px;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.35);font-family:'Montserrat',sans-serif;font-weight:700;font-size:22px;color:#fff;padding:4px 0;outline:none;\">\n\u003cdiv style=\"display:flex;gap:8px;\">\n\u003cbutton sc-camel-on-click=\"{{ copyBrief }}\" style=\"background:#FCC52A;color:#2B3A8D;border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:12px;cursor:pointer;\">{{ copyLabel }}\u003c/button>\n\u003cbutton sc-camel-on-click=\"{{ delBrief }}\" style=\"background:transparent;color:#BFE3FF;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 14px;font-size:12px;cursor:pointer;\">Удалить\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px;\">\n\u003csc-for list=\"{{ briefFields }}\" as=\"f\" hint-placeholder-count=\"6\">\n\u003cdiv style=\"background:#fff;border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;\">\n\u003cdiv style=\"display:flex;gap:12px;align-items:baseline;\">\u003cspan style=\"font-family:'Montserrat',sans-serif;font-weight:800;font-size:24px;color:#FCC52A;line-height:1;\">{{ f.en }}\u003c/span>\u003cspan style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#2B3A8D;\">{{ f.ru }}\u003c/span>\u003c/div>\n\u003cdiv style=\"font-size:11.5px;line-height:1.5;color:#5a6788;\">{{ f.hint }}\u003c/div>\n\u003ctextarea data-k=\"{{ f.k }}\" value=\"{{ f.v }}\" sc-camel-on-change=\"{{ onBrief }}\" placeholder=\"Заполнить…\" style=\"width:100%;box-sizing:border-box;min-height:90px;border:1px solid #E3EBF5;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55;resize:vertical;background:#FAFCFF;outline:none;\" style-focus=\"border-color:#288ECE;background:#fff\">\u003c/textarea>\n\u003c/div>\n\u003c/sc-for>\n\u003c/div>\n\u003c/sc-if>\n\n\u003csc-if value=\"{{ isCalc }}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;\">\n\u003csc-for list=\"{{ totals }}\" as=\"x\">\n\u003cdiv style=\"background:{{ x.bg }};color:{{ x.fg }};border-radius:16px;padding:14px 18px;\">\n\u003cdiv style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;\">{{ x.label }}\u003c/div>\n\u003cdiv style=\"font-family:'Montserrat',sans-serif;font-weight:800;font-size:24px;margin-top:4px;\">{{ x.v }}\u003c/div>\n\u003c/div>\n\u003c/sc-for>\n\u003cdiv style=\"background:#fff;border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;\">\n\u003cdiv style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#288ECE;\">1 волонтёр на N человек\u003c/div>\n\u003cinput type=\"number\" min=\"5\" value=\"{{ volRatio }}\" sc-camel-on-change=\"{{ onRatio }}\" style=\"font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px;color:#2B3A8D;border:0;border-bottom:1px solid #E3EBF5;width:100%;outline:none;background:transparent;\">\n\u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\n\u003csc-for list=\"{{ tables }}\" as=\"tb\" hint-placeholder-count=\"1\">\n\u003cdiv style=\"background:#fff;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;\">\n\u003cdiv style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;\">\n\u003cdiv style=\"display:flex;gap:10px;align-items:center;\">\u003cspan style=\"width:12px;height:18px;background:#FCC52A;border-radius:6px 6px 0 0;flex:none;\">\u003c/span>\u003cspan style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;color:#2B3A8D;\">{{ tb.title }}\u003c/span>\u003c/div>\n\u003cspan style=\"font-size:12px;color:#5a6788;\">{{ tb.note }}\u003c/span>\n\u003c/div>\n\u003cdiv style=\"overflow-x:auto;margin:0 -6px;\">\n\u003cdiv style=\"min-width:{{ tb.minW }};padding:0 6px;\">\n\u003cdiv style=\"display:grid;grid-template-columns:{{ tb.grid }};gap:4px;border-bottom:2px solid #2B3A8D;padding-bottom:6px;\">\n\u003csc-for list=\"{{ tb.cols }}\" as=\"c\">\u003cdiv style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:{{ c.color }};padding:0 8px;\">{{ c.label }}\u003c/div>\u003c/sc-for>\n\u003cdiv>\u003c/div>\n\u003c/div>\n\u003csc-for list=\"{{ tb.rows }}\" as=\"r\">\n\u003cdiv style=\"display:grid;grid-template-columns:{{ tb.grid }};gap:4px;border-bottom:1px solid #E3EBF5;align-items:start;padding:3px 0;\" style-hover=\"background:#FAFCFF\">\n\u003csc-for list=\"{{ r.cells }}\" as=\"cell\">\n\u003csc-if value=\"{{ cell.isText }}\">\u003ctextarea rows=\"1\" data-t=\"{{ cell.t }}\" data-i=\"{{ cell.i }}\" data-k=\"{{ cell.k }}\" value=\"{{ cell.v }}\" sc-camel-on-change=\"{{ onCell }}\" style=\"width:100%;box-sizing:border-box;border:0;background:transparent;resize:none;font-size:12.5px;line-height:1.5;padding:6px 8px;border-radius:6px;outline:none;min-height:30px;font-weight:{{ cell.fw }};\" style-focus=\"background:#EAF3FF\">\u003c/textarea>\u003c/sc-if>\n\u003csc-if value=\"{{ cell.isNum }}\">\u003cinput type=\"number\" data-t=\"{{ cell.t }}\" data-i=\"{{ cell.i }}\" data-k=\"{{ cell.k }}\" value=\"{{ cell.v }}\" sc-camel-on-change=\"{{ onCell }}\" style=\"width:100%;box-sizing:border-box;border:0;background:#F5F8FC;font-size:12.5px;padding:6px 8px;border-radius:6px;outline:none;\" style-focus=\"background:#EAF3FF\">\u003c/sc-if>\n\u003csc-if value=\"{{ cell.isSelect }}\">\u003csc-raw-select data-t=\"{{ cell.t }}\" data-i=\"{{ cell.i }}\" data-k=\"{{ cell.k }}\" value=\"{{ cell.v }}\" sc-camel-on-change=\"{{ onCell }}\" style=\"width:100%;border:0;font-size:11.5px;padding:6px 8px;border-radius:8px;outline:none;cursor:pointer;background:{{ cell.bg }};color:{{ cell.fg }};font-weight:700;\">\u003csc-for list=\"{{ cell.options }}\" as=\"o\">\u003coption value=\"{{ o }}\">{{ o }}\u003c/option>\u003c/sc-for>\u003c/sc-raw-select>\u003c/sc-if>\n\u003csc-if value=\"{{ cell.isOut }}\">\u003cdiv style=\"font-size:12.5px;padding:6px 8px;font-weight:700;color:{{ cell.fg }};white-space:pre-line;\">{{ cell.v }}\u003c/div>\u003c/sc-if>\n\u003c/sc-for>\n\u003cbutton data-t=\"{{ r.t }}\" data-i=\"{{ r.i }}\" sc-camel-on-click=\"{{ delRow }}\" title=\"Удалить строку\" style=\"border:0;background:transparent;color:#B8C4D9;cursor:pointer;font-size:16px;padding:6px 4px;\" style-hover=\"color:#D2453B\">×\u003c/button>\n\u003c/div>\n\u003c/sc-for>\n\u003c/div>\n\u003c/div>\n\u003cbutton data-t=\"{{ tb.key }}\" sc-camel-on-click=\"{{ addRow }}\" style=\"align-self:flex-start;border:1px dashed #288ECE;background:transparent;color:#288ECE;cursor:pointer;padding:6px 14px;border-radius:999px;font-size:12px;\">+ Добавить строку\u003c/button>\n\u003c/div>\n\u003c/sc-for>\n\n\u003csc-if value=\"{{ isCalc }}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;\">\n\u003cdiv style=\"background:#fff;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;\">\n\u003cdiv style=\"font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px;color:#FCC52A;\">A\u003c/div>\n\u003cdiv style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#2B3A8D;\">AITU бесплатно, гости платят\u003c/div>\n\u003cdiv style=\"font-size:12.5px;line-height:1.55;color:#33416b;\">Подходит для кампусных ивентов, куда хотим привести город: рейв, разборы, квизы. Окупаемость зависит от доли гостей, поэтому смотрите колонку «Безубыточность». Если гостей нужно больше половины от ожидаемого числа, снижайте расходы или ищите спонсора.\u003c/div>\n\u003c/div>\n\u003cdiv style=\"background:#fff;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;\">\n\u003cdiv style=\"font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px;color:#FCC52A;\">B\u003c/div>\n\u003cdiv style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#2B3A8D;\">Платят участники турнира, зрители бесплатно\u003c/div>\n\u003cdiv style=\"font-size:12.5px;line-height:1.55;color:#33416b;\">Стандарт для турниров: армрестлинг Open, гейминг. Взнос воспринимается как плата за участие и призовой фонд, поэтому он одинаковый для всех и не вызывает вопросов о справедливости. Зрители бесплатно = больше атмосферы и контента.\u003c/div>\n\u003c/div>\n\u003cdiv style=\"background:#fff;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;\">\n\u003cdiv style=\"font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px;color:#FCC52A;\">C\u003c/div>\n\u003cdiv style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#2B3A8D;\">Билет для всех\u003c/div>\n\u003cdiv style=\"font-size:12.5px;line-height:1.55;color:#33416b;\">Для ивентов с ощутимой ценностью в билете: еда, материалы, внешний специалист. Разбор фильма с психологом, детские мастер-классы. В цене перечисляйте, что входит, тогда цена читается как стоимость, а не как барьер.\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"background:#2B3A8D;border-radius:16px;padding:20px 24px;color:#fff;display:flex;flex-direction:column;gap:10px;\">\n\u003cdiv style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;color:#FCC52A;\">Рекомендация: как подать цену без негатива\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;font-size:12.5px;line-height:1.55;color:#E4EEFF;\">\n\u003cdiv>\u003cstrong style=\"color:#fff;\">Публично указываем цену билета, а не «платно для внешних».\u003c/strong> «Билет 1 500 ₸, внутри кофе и розыгрыш» звучит как предложение. Бесплатный вход для AITU сообщаем в каналах AITU и на сайте отдельной строкой «Студентам AITU: вход по студенческому».\u003c/div>\n\u003cdiv>\u003cstrong style=\"color:#fff;\">Промокоды для вузов-партнёров.\u003c/strong> Клубам других вузов, с которыми коллаборируем, даём такие же условия. Так льгота становится частью партнёрства, а не привилегией одного вуза.\u003c/div>\n\u003cdiv>\u003cstrong style=\"color:#fff;\">Ранняя цена и «приведи друга».\u003c/strong> Ранняя регистрация на 30% дешевле: это даёт прогноз явки за 3–4 дня и снижает риск пустого зала.\u003c/div>\n\u003cdiv>\u003cstrong style=\"color:#fff;\">Благотворительный вход.\u003c/strong> Для дней с социальной миссией взнос можно заменить вкладом: пакет корма для приюта, книга, вещь. Ноль денег, но участие измеримо.\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\">\nconst ST=['Не начато','В работе','Готово','Блок'];\nconst STC={'Не начато':['#EEF2F8','#5a6788'],'В работе':['#FFF3D1','#8A6300'],'Готово':['#DDF5E6','#1E7A45'],'Блок':['#FDE2E0','#B3261E']};\nconst LV=['Низкая','Средняя','Высокая'];\nconst LVC={'Низкая':['#DDF5E6','#1E7A45'],'Средняя':['#FFF3D1','#8A6300'],'Высокая':['#FDE2E0','#B3261E']};\nconst MOD=['A · AITU бесплатно, гости платят','B · Платят участники турнира','C · Билет для всех'];\nconst MODC={[MOD[0]]:['#EAF3FF','#2B3A8D'],[MOD[1]]:['#E6F4FB','#1C6E9E'],[MOD[2]]:['#FFF3D1','#8A6300']};\nconst T=(keys,rows)=>rows.map(r=>Object.fromEntries(keys.map((k,i)=>[k,r[i]??''])));\nconst fmt=n=>(Math.round(n)).toLocaleString('ru-RU').replace(/,/g,' ')+' ₸';\n\nconst SCHEMA={\nsteps:{title:'Как запустить систему',note:'Кто · что · когда · какой результат',cols:[['step','Шаг','1.1fr'],['who','Кто отвечает','1fr'],['what','Что делает','1.8fr'],['deadline','Срок','.6fr'],['result','Результат','1.2fr'],['status','Статус','.75fr','select',ST]]},\nsundays:{title:'Четыре воскресенья',note:'Одна тема и одна миссия на день, разные аудитории',cols:[['date','Дата','.5fr'],['theme','Тема дня','.9fr'],['mission','Миссия (Why)','1.5fr'],['audience','Аудитория','.8fr'],['events','Ивенты','1.6fr'],['locations','Локации','1fr'],['owner', , зоны и схема'],['when','When','Когда','Дата, время, тайминг дня, дедлайны подготовки: D-10 бриф, D-7 волонтёры и регистрация'],['how','How','Как','Модель входа, бюджет из калькулятора, продвижение, волонтёры, риски и план Б']];\n\nconst TABS=[\n['start','Запуск','Запуск системы','Темы четырёх воскресений и шаги, чтобы система заработала без ручного контроля каждой задачи. Правки сохраняются черновиком на этом устройстве и отправляются команде после подтверждения сервера. Статус сохранения указан вверху.',['steps']],\n['brief','Шаблон 5W1H','Шаблон мероприятия 5W1H','Шесть вопросов, на которые хост отвечает за 10 дней до ивента. Ивент без заполненного брифа не ставится в план. Кнопка «Скопировать» даёт текст для Telegram.',[]],\n['plan','4 воскресенья','План на 4 недели','У каждого воскресенья одна тема, одна миссия и своя аудитория. Киноквиз и разбор фильма чередуются раз в 2 недели (01.11, 15.11, 29.11), детские мастер-классы тоже раз в 2 недели (08.11, 22.11).',['sundays']],\n['comms','Коммуникации','План коммуникаций','С кем выходим на связь, чтобы каждый ивент рос от локального к городскому. Армрестлинг: локальный тур 25.10 → Open 15.11 с федерацией, залами и вузами → межвузовская лига в декабре.',['comms']],\n['ideas','Идеи','Гости и ивенты по аудиториям','Кого позвать и что проводить для разных аудиторий. То, что не помещается в 4 недели, лежит в банке идей.',['guests','audiences','bank']],\n['media','Медиа','Контент-план и медиаплан','Sunday Open продвигается не только через анонсы ивентов: контент показывает саму концепцию. Баланс развлекательного, основательного и продающего контента.',['pillars','channels','cycle','weekly']],\n['loc','Локации','Бронирование локаций','Брони подаём пакетом через ДНИ и ДСВР минимум за 7 дней. Лучший вариант: договориться о постоянной воскресной брони пула залов на семестр. Сроки «подать до» уточнить у ДНИ и ДСВР.',['bookings']],\n['risks','Риски','Риски и решения','Для каждого риска заранее готовы профилактика, план Б и ответственный.',['risks']],\n['calc','Калькулятор','Люди, призы, деньги','Калькулятор личный: ваши цифры сохраняются на этом устройстве и не отправляются команде. Для каждого ивента выберите модель входа и введите цифры. Колонка «Безубыточность» показывает, сколько платящих нужно, чтобы ивент окупился с учётом спонсора. Расходы «на участника» не включают зрителей.',['calc']],\n['req','Запросы','Что запросить и подготовить','Что нужно получить от команды и университета, и какие дополнительные материалы поручить.',['requests','materials']]];\n\nconst KEY='sunday-open-workspace-v1';\nconst SYNC_URL='https://script.google.com/macros/s/AKfycbx6bzomSC7jcF0HeaDKd6NgC-WmujTvMzQNls5Ow14pxpMvDvgwOFTv-2FM6NsOsp161w/exec';\nconst SHARED=Object.keys(DEF).filter(k=>k!=='calc');\n\nclass Component extends DCLogic {\n  state={tab:'start',data:JSON.parse(JSON.stringify(DEF)),brief:0,volRatio:20,copied:false,sync:SYNC_URL?'loading':'local',syncAt:'',conflictTables:[],recoveryDrafts:[]};\n  componentDidMount(){\n    this.syncStore=new WorkspaceSync({protocol:4,key:KEY,url:SYNC_URL,initialData:DEF,shared:SHARED,onChange:patch=>this.setState(patch)});\n    this.syncStore.start();\n  }\n  componentWillUnmount(){this.syncStore.stop();}\n  upd(t,fn){this.syncStore.update(t,fn);}\n  calcRow(r){\n    const n=k=>Number(r[k])||0;\n    const aitu=n('aitu'),ext=n('ext'),spect=n('spect'),price=n('price');\n    const people=aitu+ext+spect, vols=Math.max(2,Math.ceil(people/(this.state.volRatio||20)));\n    const m=r.model||MOD[0];\n    const payers=m===MOD[0]?ext:m===MOD[1]?aitu+ext:people;\n    const unit=m===MOD[0]?'гостей':m===MOD[1]?'участников':'билетов';\n    const rev=payers*price, cost=n('prizes')*n('prizePrice')+n('perHead')*(aitu+ext)+n('other');\n    const bal=rev+n('sponsor')-cost, gap=cost-n('sponsor');\n    let be,beOk;\n    if(gap\u003c=0){be='Покрыто спонсором';beOk=true;}\n    else if(price\u003c=0){be='Нужен спонсор: '+fmt(gap);beOk=false;}\n    else{const need=Math.ceil(gap/price);be=need+' '+unit+' из '+payers;beOk=need\u003c=payers;}\n    return {people,vols,rev,cost,bal,be,beOk};\n  }\n  renderVals(){\n    const {tab,data}=this.state;\n    const tb=TABS.find(t=>t[0]===tab)||TABS[0];\n    const onCell=e=>{const {t,i,k}=e.target.dataset;const v=e.target.type==='number'?e.target.value:e.target.value;this.upd(t,rows=>rows.map((r,j)=>r._id===i?{...r,[k]:v}:r));};\n    const tables=tb[4].map(key=>{\n      const sc=SCHEMA[key];\n      const grid=sc.cols.map(c=>`minmax(${c[3]==='num'?'64px':'90px'},${c[2]})`).join(' ')+' 28px';\n      const rows=(data[key]||[]).map((r,i)=>{\n        const calc=key==='calc'?this.calcRow(r):null;\n        return {t:key,i:r._id,cells:sc.cols.map(([k,,,type,opts],ci)=>{\n          const c={t:key,i:r._id,k,v:r[k]??'',isText:!type,isNum:type==='num',isSelect:type==='select',isOut:type==='out',options:opts||[],fw:ci===0?'700':'400',bg:'#EEF2F8',fg:'#14214D'};\n          if(type==='select'){const map=opts===ST?STC:opts===LV?LVC:MODC;const col=map[c.v]||['#EEF2F8','#5a6788'];c.bg=col[0];c.fg=col[1];}\n          if(type==='out'){\n            if(k==='_people'){c.v=calc.people+' / '+calc.vols;c.fg='#2B3A8D';}\n            if(k==='_rev'){c.v=fmt(calc.rev);c.fg='#2B3A8D';}\n            if(k==='_cost'){c.v=fmt(calc.cost);c.fg='#2B3A8D';}\n            if(k==='_bal'){c.v=(calc.bal>0?'+':'')+fmt(calc.bal);c.fg=calc.bal>=0?'#1E7A45':'#B3261E';}\n            if(k==='_be'){c.v=calc.be;c.fg=calc.beOk?'#1E7A45':'#B3261E';}\n          }\n          return c;})};\n      });\n      return {key,title:sc.title,note:sc.note,cols:sc.cols.map(c=>({label:c[1],color:c[3]==='out'?'#288ECE':'#2B3A8D'})),grid,minW:sc.minW||(sc.cols.length*130+'px'),rows};\n    });\n    let totals=[];\n    if(tab==='calc'){\n      const cs=(data.calc||[]).map(r=>this.calcRow(r));\n      const sum=k=>cs.reduce((a,c)=>a+c[k],0);\n      const bal=sum('bal');\n      totals=[\n        {label:'Людей за 4 недели',v:sum('people').toLocaleString('ru-RU'),bg:'#fff',fg:'#2B3A8D'},\n        {label:'Волонтёров (смен)',v:String(sum('vols')),bg:'#fff',fg:'#2B3A8D'},\n        {label:'Доход от входа',v:fmt(sum('rev')),bg:'#fff',fg:'#2B3A8D'},\n        {label:'Расходы',v:fmt(sum('cost')),bg:'#fff',fg:'#2B3A8D'},\n        {label:'Итог с учётом спонсоров',v:(bal>0?'+':'')+fmt(bal),bg:bal>=0?'#2B3A8D':'#B3261E',fg:'#fff'}];\n    }\n    const briefs=data.briefs||[];const bi=typeof this.state.brief==='string'?Math.max(0,briefs.findIndex(b=>b._id===this.state.brief)):Math.max(0,Math.min(this.state.brief,briefs.length-1));const brief=briefs[bi]||{};\n    return {\n      tabs:TABS.map(t=>({id:t[0],label:t[1],bg:t[0]===tab?'#F5F8FC':'transparent',fg:t[0]===tab?'#2B3A8D':'#fff'})),\n      setTab:e=>this.syncStore.saveView(e.currentTarget.dataset.id,this.state.volRatio),\n      tabTitle:tb[2],tabIntro:tb[3],\n      isStart:tab==='start',isBrief:tab==='brief',isCalc:tab==='calc',\n      sundays:data.sundays||[],tables,totals,onCell,\n      addRow:e=>{const t=e.currentTarget.dataset.t;const blank=Object.fromEntries(SCHEMA[t].cols.filter(c=>c[3]!=='out').map(c=>[c[0],c[3]==='select'?c[4][0]:c[3]==='num'?0:'']));this.upd(t,rows=>[...rows,blank]);},\n      delRow:e=>{const {t,i}=e.currentTarget.dataset;this.upd(t,rows=>rows.filter(r=>r._id!==i));},\n      volRatio:this.state.volRatio,\n      onRatio:e=>this.syncStore.saveView(this.state.tab,Math.max(5,Number(e.target.value)||20)),\n      briefTabs:briefs.map((b,i)=>({i:b._id,name:b.name||'Без названия',bg:i===bi?'#2B3A8D':'#fff',fg:i===bi?'#fff':'#2B3A8D'})),\n      pickBrief:e=>this.setState({brief:e.currentTarget.dataset.i}),\n      addBrief:()=>{const id='briefs-'+crypto.randomUUID();this.upd('briefs',b=>[...b,{_id:id,_o:Date.now(),name:'Новый ивент',who:'',what:'',why:'',where:'',when:'',how:''}]);this.setState({brief:id});},\n      delBrief:()=>{if(briefs.length\u003c=1)return;this.upd('briefs',b=>b.filter(x=>x._id!==brief._id));this.setState({brief:0});},\n      brief,\n      briefFields:FIELDS.map(([k,en,ru,hint])=>({k,en,ru,hint,v:brief[k]||''})),\n      onBrief:e=>{const k=e.target.dataset.k,v=e.target.value;this.upd('briefs',b=>b.map(x=>x._id===brief._id?{...x,[k]:v}:x));},\n      copyBrief:()=>{const txt=brief.name+'\\n\\n'+FIELDS.map(([k,en,ru])=>`${en} · ${ru}\\n${brief[k]||'—'}`).join('\\n\\n');navigator.clipboard&&navigator.clipboard.writeText(txt);this.setState({copied:true});setTimeout(()=>this.setState({copied:false}),1500);},\n      copyLabel:this.state.copied?'Скопировано':'Скопировать текст',\n      savedLabel:{approval:'Ожидает одобрения · локальные правки сохранены',rejected:'Правка отклонена · черновик сохранён. Измените текст для повторной отправки.',local:'Черновик сохранён на этом устройстве',loading:'Загружаю данные команды…',pending:'Черновик на устройстве · ожидает отправки',saving:'Черновик на устройстве · отправляю…',ok:'Все правки сохранены для команды',err:'Нет подтверждения сервера · черновик на устройстве',upgrade:'Общее сохранение ждёт обновления сервера · черновик на устройстве',conflict:'Конфликт изменений · ваш черновик сохранён',storage:'Не удалось сохранить копию на устройстве. Не закрывайте страницу.'}[this.state.sync],\n      hasConflicts:this.state.conflictTables.length>0,\n      conflictNames:this.state.conflictTables.map(t=>SCHEMA[t]?.title||'Брифы 5W1H').join(', '),\n      hasRecovery:this.state.recoveryDrafts.length>0,\n      recoveryDrafts:this.state.recoveryDrafts.map(d=>({...d,tables:d.tables.split(', ').map(t=>SCHEMA[t]?.title||'Брифы 5W1H').join(', ')})),\n      retrySync:()=>this.syncStore.retry(),\n      downloadBackup:()=>this.syncStore.download(),\n      recoverDraft:e=>{if(window.confirm('Открыть этот черновик? Текущие несохранённые правки останутся в истории черновиков.'))this.syncStore.restore(e.currentTarget.dataset.id);},\n      useTeamVersion:()=>{if(window.confirm('Загрузить версию команды для конфликтующих строк? Ваши правки останутся в истории черновиков.'))this.syncStore.useRemote();},\n      resetAll:()=>{this.syncStore.update('calc',()=>JSON.parse(JSON.stringify(DEF.calc)));this.syncStore.saveView(this.state.tab,20);}\n\n    };\n  }\n}\n\u003c/script>\n\n\n\u003c/body>\u003c/html>"</script>
